<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registre des Traques</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060304;
    --panel: #100709;
    --panel-2: #180b0e;
    --line: #34161b;
    --line-2: #4a1d24;
    --text: #ece4e5;
    --muted: #9a8689;
    --red: #b3001b;
    --glow: #ff1f3d;
    --red-dim: #4d0610;
    --gold: #c9a24a;
    --ok: #3fa66b;
    --warn: #e08a1e;
    --blue: #3a8bd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(179,0,27,.28), transparent 70%),
      radial-gradient(ellipse 60% 40% at 50% 110%, rgba(179,0,27,.12), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    min-height: 100vh;
  }
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  }
  #login, #app { position: relative; z-index: 1; }
  h1, h2, h3, .cin { font-family: 'Cinzel', serif; letter-spacing: 0.1em; text-transform: uppercase; }
  button, input, select, textarea { font-family: inherit; font-size: 15px; }
  .hidden { display: none !important; }

  .emblem { color: var(--glow); filter: drop-shadow(0 0 8px rgba(255,31,61,.55)); display: block; }

  /* ---------- CONNEXION ---------- */
  #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-box {
    width: 100%; max-width: 420px; background: linear-gradient(180deg, #14080b, #0c0507);
    border: 1px solid var(--line); padding: 34px 28px; position: relative;
    box-shadow: 0 0 60px rgba(179,0,27,.18), inset 0 1px 0 rgba(255,31,61,.25);
    clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
  }
  .login-box::before { content: ''; position: absolute; top: 0; left: 18px; right: 18px; height: 2px; background: linear-gradient(90deg, transparent, var(--glow), transparent); }
  .login-box .emblem { width: 76px; height: 76px; margin: 0 auto 16px; }
  .login-box h1 { text-align: center; font-size: 21px; margin-bottom: 6px; }
  .login-box .sub { text-align: center; color: var(--muted); margin-bottom: 26px; letter-spacing: 0.25em; font-size: 11px; text-transform: uppercase; }
  .login-box .faction { text-align: center; color: var(--glow); font-family: 'Cinzel'; font-size: 12px; letter-spacing: .35em; margin-bottom: 4px; }

  label.f { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field { margin-bottom: 14px; }
  input[type=text], input[type=password], input[type=number], input[type=url], select, textarea {
    width: 100%; background: #080405; border: 1px solid var(--line); color: var(--text); padding: 10px 12px; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 1px rgba(255,31,61,.25); }
  textarea { resize: vertical; min-height: 80px; }

  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line-2); padding: 10px 16px;
    cursor: pointer; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; font-size: 13px; transition: all .15s;
  }
  .btn:hover { border-color: var(--red); color: #fff; }
  .btn.primary { background: linear-gradient(180deg, #c8001f, #8a0015); border-color: #d1102e; color: #fff; box-shadow: 0 0 14px rgba(255,31,61,.25); }
  .btn.primary:hover { box-shadow: 0 0 22px rgba(255,31,61,.5); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: #ff6b7f; border-color: var(--red-dim); }
  .btn.danger:hover { background: var(--red-dim); }
  .btn.small { padding: 6px 10px; font-size: 12px; }
  .btn.block { width: 100%; }
  .btn.active { border-color: var(--glow); color: #fff; background: rgba(255,31,61,.15); box-shadow: inset 0 0 10px rgba(255,31,61,.2); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .err { color: #ff6b7f; font-size: 14px; margin-top: 10px; min-height: 18px; text-align: center; }

  /* ---------- APP ---------- */
  header {
    background: rgba(12,5,7,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--red), transparent); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .emblem { width: 40px; height: 40px; }
  .brand h1 { font-size: 16px; }
  .brand small { display: block; color: var(--glow); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; font-family: 'Cinzel'; }
  .who { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .badge { display: inline-block; padding: 3px 9px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; border: 1px solid currentColor; }
  .b-referent { color: var(--gold); }
  .b-assassin { color: var(--glow); }
  .b-maraudeur { color: #9b7cff; }

  main { max-width: 1280px; margin: 0 auto; padding: 24px 16px 60px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .stat { background: var(--panel); border: 1px solid var(--line); padding: 14px 16px; border-left: 3px solid var(--line-2); }
  .stat .n { font-family: 'Cinzel'; font-size: 28px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .15em; }
  .stat.s-active { border-left-color: var(--glow); }
  .stat.s-cours { border-left-color: var(--warn); }
  .stat.s-done { border-left-color: var(--ok); }
  .stat.s-crit { border-left-color: #ff2a4d; box-shadow: inset 4px 0 12px -6px rgba(255,31,61,.6); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .toolbar input, .toolbar select { width: auto; flex: 1 1 160px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .card {
    background: linear-gradient(180deg, #13080a, #0d0507); border: 1px solid var(--line); display: flex; flex-direction: column;
    position: relative; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover { border-color: var(--red); transform: translateY(-2px); box-shadow: 0 6px 24px rgba(179,0,27,.25); }
  .card .danger-bar { height: 3px; }
  .card-top { display: flex; gap: 14px; padding: 16px; }
  .portrait {
    width: 74px; height: 90px; flex-shrink: 0; background: #050203; border: 1px solid var(--line-2);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-family: 'Cinzel'; font-size: 22px; color: var(--muted);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(0.35) contrast(1.1) sepia(.15); }
  .card h3 { font-size: 15px; line-height: 1.3; margin-bottom: 4px; word-break: break-word; }
  .card .race { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .card .motif { font-size: 14px; color: #cdbfc1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .prime { font-family: 'Cinzel'; color: var(--gold); font-size: 14px; font-weight: 700; }
  .status { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; display: inline-block; }
  .st-active { background: rgba(255,31,61,.15); color: #ff5a72; }
  .st-cours { background: rgba(224,138,30,.15); color: var(--warn); }
  .st-eliminee, .st-capturee { background: rgba(63,166,107,.15); color: #5fd38f; }
  .st-annulee { background: rgba(154,134,137,.15); color: var(--muted); }
  .dlvl { display: inline-flex; gap: 3px; vertical-align: middle; }
  .dlvl i { width: 10px; height: 10px; border: 1px solid var(--line-2); display: inline-block; transform: rotate(45deg); }
  .stamp { position: absolute; top: 18px; right: -34px; transform: rotate(35deg); background: var(--ok); color: #fff; font-family: 'Cinzel'; font-size: 10px; padding: 3px 40px; letter-spacing: .15em; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; border: 1px dashed var(--line-2); }

  /* ---------- MODALES ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; z-index: 50; }
  .modal { background: linear-gradient(180deg, #14080b, #0c0507); border: 1px solid var(--line-2); width: 100%; max-width: 760px; position: relative; box-shadow: 0 0 50px rgba(179,0,27,.25); }
  .modal::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--glow), transparent); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { font-size: 15px; }
  .modal-body { padding: 20px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .x { background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
  .x:hover { color: var(--text); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .form-grid .full { grid-column: 1 / -1; }
  .section-title { font-family: 'Cinzel'; font-size: 11px; color: var(--glow); letter-spacing: .25em; margin: 8px 0 12px; grid-column: 1/-1; border-bottom: 1px solid var(--line); padding-bottom: 6px; text-transform: uppercase; }
  .danger-pick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .danger-pick label { border: 1px solid var(--line); padding: 8px 4px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #080405; }
  .danger-pick input { display: none; }

  .dossier { display: grid; grid-template-columns: 150px 1fr; gap: 20px; }
  .dossier .portrait { width: 150px; height: 190px; font-size: 40px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
  .kv div span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .15em; }
  .kv div b { font-weight: 600; font-size: 16px; }
  .block { margin-top: 18px; }
  .block h4 { font-family: 'Cinzel'; font-size: 11px; color: var(--glow); letter-spacing: .25em; margin-bottom: 6px; text-transform: uppercase; }
  .block p { white-space: pre-wrap; color: #d3c6c8; line-height: 1.5; }
  .reports { display: flex; flex-direction: column; gap: 8px; }
  .report { background: #080405; border-left: 2px solid #9b7cff; padding: 8px 12px; font-size: 14px; }
  .report small { color: var(--muted); display: block; margin-bottom: 2px; }
  .report-form { display: flex; gap: 8px; margin-top: 10px; }
  .report-form input { flex: 1; }

  .src-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .dropzone { display: flex; align-items: center; justify-content: center; min-height: 110px; border: 1px dashed var(--line-2); background: #080405; color: var(--muted); cursor: pointer; text-align: center; padding: 14px; transition: border-color .15s; }
  .dropzone:hover, .dropzone.over { border-color: var(--glow); color: var(--text); }
  .p-preview { margin-top: 10px; text-align: center; }
  .p-preview img { max-width: 100%; max-height: 240px; border: 1px solid var(--line-2); background: #000; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #14080b; border: 1px solid var(--line-2); border-left: 3px solid var(--glow); padding: 10px 18px; z-index: 100; font-weight: 600; max-width: 90vw; }

  .net { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); text-align: center; margin-top: 12px; }
  .net::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 7px; vertical-align: middle; }
  .net.ok { color: #5fd38f; } .net.ok::before { background: #3fa66b; box-shadow: 0 0 6px #3fa66b; }
  .net.bad { color: #ff6b7f; } .net.bad::before { background: var(--glow); }
  header .net { margin-top: 0; }

  /* ---------- TABLEAU D'ENQUÊTE ---------- */
  .board { position: fixed; inset: 0; z-index: 40; background: #040203; display: flex; flex-direction: column; }
  .board-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 14px; background: #0e0608; border-bottom: 1px solid var(--line-2); position: relative; z-index: 2; }
  .bb-title { font-family: 'Cinzel'; font-size: 13px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  .bb-title b { color: var(--text); }
  .bb-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bb-sep { width: 1px; height: 24px; background: var(--line-2); margin: 0 4px; }
  .sw { width: 22px; height: 22px; border: 2px solid #000; outline: 1px solid var(--line-2); cursor: pointer; padding: 0; }
  .sw.active { outline: 2px solid #fff; }
  .bb-zoom { min-width: 44px; text-align: center; font-size: 13px; color: var(--muted); }
  .board-view { flex: 1; position: relative; overflow: hidden; touch-action: none; cursor: grab;
    background: radial-gradient(ellipse at center, #120609 0%, #040203 75%); }
  .board-view.panning { cursor: grabbing; }
  .board.t-draw .board-view { cursor: crosshair; }
  .board.t-text .board-view { cursor: text; }
  .board.t-link .board-view .bi { cursor: alias; }
  .board.t-erase .board-view { cursor: not-allowed; }
  .board-world { position: absolute; left: 0; top: 0; width: 4000px; height: 2600px; transform-origin: 0 0;
    background-image:
      linear-gradient(rgba(255,31,61,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,31,61,.07) 1px, transparent 1px),
      linear-gradient(rgba(255,31,61,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,31,61,.03) 1px, transparent 1px);
    background-size: 200px 200px, 200px 200px, 40px 40px, 40px 40px;
    border: 1px solid rgba(255,31,61,.25); box-shadow: 0 0 80px rgba(179,0,27,.15) inset; }
  .b-svg { position: absolute; left: 0; top: 0; width: 4000px; height: 2600px; overflow: visible; pointer-events: none; }
  #bItems { position: absolute; left: 0; top: 0; }
  .b-svg .st, .b-svg .lk { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .b-svg .lk { stroke-width: 2.5; filter: drop-shadow(0 0 3px rgba(255,31,61,.6)); }
  .b-svg .lk.tmp { stroke: #fff; stroke-dasharray: 6 6; opacity: .7; }
  .b-svg .hit { stroke: transparent; fill: none; }
  .board.t-erase .b-svg .hit, .board.t-select #bLinks .hit { pointer-events: stroke; cursor: pointer; }
  .board.t-erase .b-svg .hit:hover { stroke: rgba(255,255,255,.18); }
  .lk-label { font: 700 15px 'Rajdhani', sans-serif; fill: #fff; paint-order: stroke; stroke: #000; stroke-width: 5px; letter-spacing: .05em; }

  .bi { position: absolute; user-select: none; -webkit-user-select: none; }
  .bi-pin { position: absolute; top: -8px; left: 50%; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff8a96, #c8001f 55%, #5a0010); box-shadow: 0 3px 5px rgba(0,0,0,.8); z-index: 2; }
  .bi-photo { background: #120a0c; border: 1px solid #3d2328; padding: 12px 10px 8px; box-shadow: 0 10px 24px rgba(0,0,0,.7); }
  .bp-img { background: #000; min-height: 60px; display: flex; align-items: center; justify-content: center; }
  .bp-img img { width: 100%; display: block; max-height: 280px; object-fit: contain; pointer-events: none; }
  .bp-missing { color: var(--muted); font-size: 13px; padding: 20px 8px; text-align: center; }
  .bp-cat { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--glow); border: 1px solid rgba(255,31,61,.5); padding: 2px 7px; }
  .bp-cap { font-size: 14px; margin-top: 5px; color: #e6dadb; line-height: 1.3; word-break: break-word; }
  .bi-note { background: linear-gradient(180deg, #1d0c10, #150709); border: 1px solid #3d2328; border-left: 4px solid var(--glow); padding: 16px 12px 12px; min-height: 64px; box-shadow: 0 10px 24px rgba(0,0,0,.7); }
  .bn-text { font-size: 16px; white-space: pre-wrap; word-break: break-word; min-height: 22px; line-height: 1.35; }
  .bi-text .bx-text { font-weight: 700; white-space: pre; text-shadow: 0 0 10px rgba(0,0,0,.9), 0 2px 2px #000; line-height: 1.15; min-width: 20px; min-height: 1em; }
  .bi-target { background: linear-gradient(180deg, #1a070b, #0c0406); border: 1px solid var(--glow); box-shadow: 0 0 40px rgba(255,31,61,.35); padding: 16px 14px 14px; text-align: center; }
  .bt-label { font-family: 'Cinzel'; font-size: 12px; letter-spacing: .4em; color: var(--glow); margin-bottom: 10px; }
  .bt-portrait { width: 150px; height: 180px; margin: 0 auto 10px; font-size: 42px; }
  .bt-name { font-family: 'Cinzel'; font-size: 17px; font-weight: 700; letter-spacing: .06em; }
  .bt-race { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .bt-meta { display: flex; justify-content: center; gap: 10px; align-items: center; margin-bottom: 8px; }
  .bi.sel { outline: 2px solid var(--glow); outline-offset: 4px; }
  .bi.linkfrom { outline: 2px dashed #fff; outline-offset: 4px; }
  .bi-act { position: absolute; top: -40px; right: 0; display: none; gap: 4px; white-space: nowrap; z-index: 3; }
  .board.t-select .bi:hover .bi-act, .board.t-select .bi.sel .bi-act { display: flex; }
  [contenteditable=true] { outline: 1px dashed var(--muted); cursor: text; user-select: text; -webkit-user-select: text; }
  .board-hint { position: absolute; left: 14px; bottom: 14px; background: rgba(14,6,8,.9); border: 1px solid var(--line-2); padding: 7px 12px; font-size: 13px; color: var(--muted); pointer-events: none; max-width: calc(100% - 28px); }

  @media (max-width: 640px) {
    header { padding: 12px 16px; }
    .form-grid { grid-template-columns: 1fr; }
    .dossier { grid-template-columns: 1fr; }
    .dossier .portrait { margin: 0 auto; }
    .kv { grid-template-columns: 1fr; }
    .danger-pick { grid-template-columns: repeat(3, 1fr); }
    .bb-sep { display: none; }
  }
</style>
</head>
<body>

<!-- Emblème (création originale) -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="emblem" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="miter">
      <circle cx="50" cy="50" r="45"/>
      <circle cx="50" cy="50" r="38" stroke-width="1.2" opacity=".6"/>
      <path d="M50 8 L60 42 L50 92 L40 42 Z"/>
      <path d="M22 34 L40 42 M78 34 L60 42" />
      <path d="M26 66 L42 58 M74 66 L58 58" stroke-width="2" opacity=".8"/>
    </g>
    <circle cx="50" cy="46" r="4.5" fill="currentColor"/>
  </symbol>
</svg>

<!-- ================= CONNEXION ================= -->
<section id="login">
  <div class="login-box">
    <svg class="emblem"><use href="#emblem"/></svg>
    <div class="faction">Empire Sith</div>
    <h1>Registre des Traques</h1>
    <div class="sub">Renseignement impérial — Accès restreint</div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label class="f" for="pseudo">Matricule / Nom de code</label>
        <input type="text" id="pseudo" required maxlength="40" placeholder="ex : TK-4471">
      </div>
      <div class="field">
        <label class="f" for="code">Code d'accès</label>
        <input type="password" id="code" required placeholder="••••••••">
      </div>
      <button class="btn primary block" type="submit">Accéder au registre</button>
      <div class="err" id="loginErr"></div>
      <div class="net" id="netStatus"></div>
    </form>
  </div>
</section>

<!-- ================= APPLICATION ================= -->
<section id="app" class="hidden">
  <header>
    <div class="brand">
      <svg class="emblem"><use href="#emblem"/></svg>
      <div><h1>Registre des Traques</h1><small>Empire Sith · Renseignement</small></div>
    </div>
    <div class="who">
      <span class="net" id="netBadge"></span>
      <span id="whoName" style="font-weight:700"></span>
      <span id="whoRole" class="badge"></span>
      <button class="btn small" id="accessBtn">Gestion des accès</button>
      <button class="btn small ghost" id="logoutBtn">Déconnexion</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="text" id="search" placeholder="Rechercher un nom, une race, un motif…">
      <select id="fStatus"><option value="">Tous les statuts</option></select>
      <select id="fDanger"><option value="">Toute dangerosité</option></select>
      <select id="fSort">
        <option value="recent">Plus récentes</option>
        <option value="danger">Plus dangereuses</option>
        <option value="prime">Prime la plus haute</option>
        <option value="nom">Nom (A→Z)</option>
      </select>
      <button class="btn primary" id="newBtn">+ Nouvelle traque</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="toolbar" id="adminTools" style="margin-top:28px">
      <span style="color:var(--muted);font-size:13px">Sauvegarde des dossiers et accès :</span>
      <button class="btn small" id="exportBtn">Exporter (.json)</button>
      <label class="btn small" style="display:inline-block">Importer (.json)
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </label>
    </div>
  </main>
</section>

<div id="modalRoot"></div>

<script>
/* =====================================================================
   FIREBASE — configuration du projet
   (Console Firebase → Paramètres du projet → Tes applications → Config)
   Si elle est vide, le site fonctionne en « mode local ».
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBndauvLzaj6QcrrYTcleASfGLXxSn3ows",
  authDomain: "registre-traques.firebaseapp.com",
  projectId: "registre-traques",
  storageBucket: "registre-traques.firebasestorage.app",
  messagingSenderId: "903427787873",
  appId: "1:903427787873:web:91b3b62194319e3dddee20",
  measurementId: "G-NSY0PFVS0G"
};
const CLOUD = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId);
const FIREBASE_VERSION = "10.12.2";

/* =====================================================================
   CONFIGURATION
   Compte Référent principal (permanent, ne peut pas être supprimé).
   Les autres accès se créent depuis le panel « Gestion des accès ».
   ===================================================================== */
const CONFIG = {
  root: { pseudo: "VL-3009", code: "Vhaelor", role: "referent" },
  roles: {
    referent:  { label: "Référent Traque", desc: "Crée, modifie et supprime les traques, gère les accès" },
    assassin:  { label: "Assassin",        desc: "Prend en charge et clôture les traques" },
    maraudeur: { label: "Maraudeur",       desc: "Consulte et transmet des signalements" }
  }
};

const PERMS = {
  referent:  { create: true,  edit: true,  delete: true,  claim: true,  close: true,  report: true,  backup: true },
  assassin:  { create: false, edit: false, delete: false, claim: true,  close: true,  report: true,  backup: false },
  maraudeur: { create: false, edit: false, delete: false, claim: false, close: false, report: true,  backup: false }
};

const DANGER = [
  { v: 1, label: "Faible",   color: "#3fa66b" },
  { v: 2, label: "Modéré",   color: "#c9b52a" },
  { v: 3, label: "Élevé",    color: "#e08a1e" },
  { v: 4, label: "Extrême",  color: "#e0461e" },
  { v: 5, label: "Critique", color: "#ff1f3d" }
];
const STATUS = { active: "Active", cours: "En cours", capturee: "Capturée", eliminee: "Éliminée", annulee: "Annulée" };
const MODES = { vivant: "Vivant uniquement", mort: "Mort", indifferent: "Mort ou vif" };
const RACES = ["Humain","Sith Sang-Pur","Chiss","Zabrak","Twi'lek","Rattataki","Cathar","Mirialan","Miraluka","Togruta","Nautolan","Kel Dor","Rodien","Trandoshan","Wookiee","Cyborg","Droïde"];

const STORE_KEY = "registre_traques_v1";
const ACCESS_KEY = "registre_acces_v1";
const SESSION_KEY = "registre_traques_session";

/* ---------------- Utilitaires ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clean = o => JSON.parse(JSON.stringify(o));
const fmtDate = t => new Date(t).toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
const fmtPrime = n => n ? Number(n).toLocaleString("fr-FR") + " cr." : "—";
let session = null;
const can = p => session && PERMS[session.role] && PERMS[session.role][p];

function toast(msg) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
}
function dangerBars(v) {
  const d = DANGER[v - 1] || DANGER[0];
  return `<span class="dlvl" title="${d.label}">${DANGER.map((_, i) =>
    `<i style="${i < v ? `background:${d.color};border-color:${d.color}` : ""}"></i>`).join("")}</span>`;
}
function initials(t) { return (((t.prenom || "")[0] || "") + ((t.nom || "")[0] || "")) || "?"; }
function portrait(t) {
  const ini = esc(initials(t)).toUpperCase();
  return t.photo ? `<img src="${esc(t.photo)}" alt="" onerror="this.replaceWith(document.createTextNode('${ini}'))">` : ini;
}

/* ---------------- Stockage (Firebase ou local) ---------------- */
function loadLocal(key) {
  if (CLOUD) return [];
  try { return JSON.parse(localStorage.getItem(key)) || []; } catch (e) { return []; }
}
function saveLocal() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(traques));
    localStorage.setItem(ACCESS_KEY, JSON.stringify(acces));
  } catch (e) { toast("Sauvegarde impossible dans ce navigateur"); }
}
let traques = loadLocal(STORE_KEY);
let acces = loadLocal(ACCESS_KEY);

let fb = null;
let ready = !CLOUD;
let gotT = false, gotA = false;
let currentView = null;

async function writeDoc(col, obj) {
  if (!CLOUD) {
    const arr = col === "traques" ? traques : acces;
    if (!arr.includes(obj)) arr.push(obj);
    saveLocal(); return true;
  }
  if (!fb) { toast("Base non connectée"); return false; }
  try { await fb.setDoc(fb.doc(fb.db, col, obj.id), clean(obj)); return true; }
  catch (e) { netError(e); toast("Échec de l'enregistrement"); return false; }
}
async function removeDoc(col, id) {
  if (!CLOUD) {
    if (col === "traques") traques = traques.filter(x => x.id !== id);
    else acces = acces.filter(x => x.id !== id);
    saveLocal(); return true;
  }
  if (!fb) { toast("Base non connectée"); return false; }
  try { await fb.deleteDoc(fb.doc(fb.db, col, id)); return true; }
  catch (e) { netError(e); toast("Échec de la suppression"); return false; }
}
const putTraque = t => writeDoc("traques", t);
const delTraque = id => removeDoc("traques", id);
const putAcces  = a => writeDoc("acces", a);
const delAcces  = id => removeDoc("acces", id);

function setNet(msg, state) {
  ["#netStatus", "#netBadge"].forEach(s => {
    const el = $(s); if (!el) return;
    el.textContent = msg;
    el.className = "net" + (state === "ok" ? " ok" : state === "bad" ? " bad" : "");
  });
}
function netError(e) {
  console.error(e);
  const code = String((e && (e.code || e.message)) || "inconnue");
  let msg = "Erreur base de données : " + code;
  if (code.includes("permission")) msg = "Accès refusé par Firebase (vérifie les règles Firestore)";
  if (code.includes("configuration-not-found") || code.includes("operation-not-allowed") || code.includes("admin-restricted"))
    msg = "Active la connexion « Anonyme » dans Firebase Authentication";
  setNet(msg, "bad");
}

async function initCloud() {
  setNet("Connexion au registre…");
  try {
    const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
    const [appM, fsM, authM] = await Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-firestore.js"),
      import(base + "firebase-auth.js")
    ]);
    const app = appM.initializeApp(FIREBASE_CONFIG);
    await authM.signInAnonymously(authM.getAuth(app));
    const db = fsM.getFirestore(app);
    fb = { db, ...fsM };
    fsM.onSnapshot(fsM.collection(db, "traques"),
      snap => { traques = snap.docs.map(d => d.data()); gotT = true; onData(); }, netError);
    fsM.onSnapshot(fsM.collection(db, "acces"),
      snap => { acces = snap.docs.map(d => d.data()); gotA = true; onData(); }, netError);
  } catch (e) { netError(e); }
}

function onData() {
  if (!ready && gotT && gotA) {
    ready = true;
    setNet("Registre synchronisé", "ok");
    restoreSession();
    return;
  }
  if (!ready || !session) return;
  const acc = findAccount(session.pseudo);
  if (!acc || !acc.actif) { logout(); $("#loginErr").textContent = "Ton accès a été révoqué ou suspendu."; return; }
  if (acc.role !== session.role) { session.role = acc.role; showApp(); }
  render();
  if (B) {
    if (!traques.some(t => t.id === B.tid)) { closeBoard(); toast("Ce dossier a été supprimé"); }
    else renderBoard();
  }
  refreshOpenModal();
}
function refreshOpenModal() {
  if (!currentView || currentView.type === "form") return;
  const a = document.activeElement;
  if (a && $("#modalRoot").contains(a) && ["INPUT", "TEXTAREA", "SELECT"].includes(a.tagName) && a.value) return;
  if (currentView.type === "detail") {
    if (traques.some(t => t.id === currentView.id)) openDetail(currentView.id); else closeModal();
  } else if (currentView.type === "access") openAccess();
}

function findAccount(pseudo) {
  const p = String(pseudo || "").trim().toLowerCase();
  if (p === CONFIG.root.pseudo.toLowerCase()) return { ...CONFIG.root, root: true, actif: true };
  return acces.find(a => String(a.pseudo).toLowerCase() === p);
}

/* ---------------- Connexion ---------------- */
$("#loginForm").onsubmit = e => {
  e.preventDefault();
  const pseudo = $("#pseudo").value.trim();
  const code = $("#code").value;
  if (!pseudo) return;
  if (!ready) { $("#loginErr").textContent = "Registre en cours de chargement, réessaie dans un instant."; return; }
  const acc = findAccount(pseudo);
  if (!acc || acc.code !== code) { $("#loginErr").textContent = "Matricule ou code d'accès refusé."; $("#code").value = ""; return; }
  if (!acc.actif) { $("#loginErr").textContent = "Cet accès a été suspendu."; $("#code").value = ""; return; }
  session = { role: acc.role, pseudo: acc.pseudo };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
  $("#loginErr").textContent = ""; $("#code").value = "";
  showApp();
};
function logout() {
  session = null;
  try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
  closeBoard(); closeModal();
  $("#app").classList.add("hidden"); $("#login").classList.remove("hidden");
}
$("#logoutBtn").onclick = logout;

function restoreSession() {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) {}
  if (!s) return;
  const acc = findAccount(s.pseudo || "");
  if (acc && acc.actif) { session = { pseudo: acc.pseudo, role: acc.role }; showApp(); }
  else { try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
}

function showApp() {
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoName").textContent = session.pseudo;
  const r = $("#whoRole");
  r.textContent = CONFIG.roles[session.role].label;
  r.className = "badge b-" + session.role;
  $("#newBtn").classList.toggle("hidden", !can("create"));
  $("#adminTools").classList.toggle("hidden", !can("backup"));
  $("#accessBtn").classList.toggle("hidden", session.role !== "referent");
  render();
}

/* ---------------- Gestion des accès (Référent) ---------------- */
function genCode() {
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = ""; for (let i = 0; i < 8; i++) s += c[Math.floor(Math.random() * c.length)];
  return s;
}
function openAccess() {
  if (!session || session.role !== "referent") return;
  currentView = { type: "access" };
  const rows = [{ ...CONFIG.root, root: true, actif: true }, ...acces];
  const td = `style="padding:8px 6px"`;
  modal(`
    <div class="modal-head"><h2>Gestion des accès</h2><button class="x" data-close>&times;</button></div>
    <div class="modal-body">
      <form id="accForm" class="form-grid" autocomplete="off">
        <div class="section-title">Créer un accès</div>
        <div class="field"><label class="f">Matricule *</label><input type="text" name="pseudo" required maxlength="40" placeholder="ex : TK-4471"></div>
        <div class="field"><label class="f">Grade *</label>
          <select name="role">${Object.entries(CONFIG.roles).map(([k, r]) =>
            `<option value="${k}" ${k === "assassin" ? "selected" : ""}>${r.label}</option>`).join("")}</select>
        </div>
        <div class="field full"><label class="f">Code d'accès *</label>
          <div style="display:flex;gap:8px">
            <input type="text" name="code" required maxlength="40" value="${genCode()}">
            <button type="button" class="btn small" id="regen">Générer</button>
          </div>
        </div>
        <div class="full" style="margin-bottom:6px"><button class="btn primary" type="submit">Créer l'accès</button></div>
        <div class="err full" id="accErr" style="text-align:left"></div>
      </form>

      <div class="section-title" style="margin-top:10px">Accès existants (${rows.length})</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead><tr style="text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em">
          <th ${td}>Matricule</th><th ${td}>Grade</th><th ${td}>Code</th><th ${td}>État</th><th ${td}></th></tr></thead>
        <tbody>${rows.map(a => `
          <tr style="border-top:1px solid var(--line)">
            <td ${td}><b>${esc(a.pseudo)}</b>${a.root ? ` <span style="color:var(--muted)">(principal)</span>` : ""}</td>
            <td ${td}><span class="badge b-${a.role}">${CONFIG.roles[a.role]?.label || a.role}</span></td>
            <td ${td} style="padding:8px 6px;font-family:monospace">${a.root ? "••••••" : `<span class="code-mask" data-code="${esc(a.code)}" style="cursor:pointer" title="Cliquer pour afficher">••••••</span>`}</td>
            <td ${td}>${a.actif ? `<span style="color:#5fd38f">Actif</span>` : `<span style="color:var(--muted)">Suspendu</span>`}</td>
            <td style="padding:8px 6px;text-align:right;white-space:nowrap">${a.root ? "" : `
              <button class="btn small" data-act="toggle" data-id="${esc(a.id)}">${a.actif ? "Suspendre" : "Réactiver"}</button>
              <button class="btn small" data-act="reset" data-id="${esc(a.id)}">Nouveau code</button>
              <button class="btn small danger" data-act="del" data-id="${esc(a.id)}">Révoquer</button>`}
            </td>
          </tr>`).join("")}
        </tbody>
      </table>
      </div>
    </div>`);

  $("#regen").onclick = () => { $("#accForm [name=code]").value = genCode(); };
  document.querySelectorAll(".code-mask").forEach(el => el.onclick = () => {
    el.textContent = el.textContent === "••••••" ? el.dataset.code : "••••••";
  });
  $("#accForm").onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target).entries());
    f.pseudo = f.pseudo.trim(); f.code = f.code.trim();
    if (!f.pseudo || !f.code) return;
    if (findAccount(f.pseudo)) { $("#accErr").textContent = "Ce matricule possède déjà un accès."; return; }
    const ok = await putAcces({ id: uid(), pseudo: f.pseudo, code: f.code, role: f.role, actif: true, createdAt: Date.now(), createdBy: session.pseudo });
    if (!ok) return;
    openAccess();
    toast(`Accès ${CONFIG.roles[f.role].label} créé pour ${f.pseudo} — code : ${f.code}`);
  };
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
    const a = acces.find(x => x.id === b.dataset.id); if (!a) return;
    let ok;
    if (b.dataset.act === "toggle") {
      a.actif = !a.actif; ok = await putAcces(a); if (ok) toast(a.actif ? "Accès réactivé" : "Accès suspendu");
    } else if (b.dataset.act === "reset") {
      a.code = genCode(); ok = await putAcces(a); if (ok) toast(`Nouveau code pour ${a.pseudo} : ${a.code}`);
    } else if (b.dataset.act === "del") {
      if (!confirm(`Révoquer définitivement l'accès de ${a.pseudo} ?`)) return;
      ok = await delAcces(a.id); if (ok) toast("Accès révoqué");
    }
    openAccess();
  });
}
$("#accessBtn").onclick = openAccess;

/* ---------------- Liste des traques ---------------- */
$("#fStatus").innerHTML += Object.entries(STATUS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("");
$("#fDanger").innerHTML += DANGER.map(d => `<option value="${d.v}">${d.v} — ${d.label}</option>`).join("");
["#search", "#fStatus", "#fDanger", "#fSort"].forEach(s => $(s).addEventListener("input", render));

function render() {
  if (!session) return;
  const c = s => traques.filter(t => t.statut === s).length;
  $("#stats").innerHTML = `
    <div class="stat"><div class="n">${traques.length}</div><div class="l">Dossiers</div></div>
    <div class="stat s-active"><div class="n">${c("active")}</div><div class="l">Actives</div></div>
    <div class="stat s-cours"><div class="n">${c("cours")}</div><div class="l">En cours</div></div>
    <div class="stat s-done"><div class="n">${c("eliminee") + c("capturee")}</div><div class="l">Clôturées</div></div>
    <div class="stat s-crit"><div class="n">${traques.filter(t => t.danger >= 4 && ["active","cours"].includes(t.statut)).length}</div><div class="l">Menaces majeures</div></div>`;

  const q = $("#search").value.toLowerCase().trim();
  const fs = $("#fStatus").value, fd = $("#fDanger").value, sort = $("#fSort").value;
  const list = traques.filter(t => {
    if (fs && t.statut !== fs) return false;
    if (fd && String(t.danger) !== fd) return false;
    if (q) {
      const hay = [t.nom, t.prenom, t.alias, t.race, t.motif, t.affiliation, t.localisation].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const sorters = {
    recent: (a, b) => (b.createdAt || 0) - (a.createdAt || 0),
    danger: (a, b) => b.danger - a.danger,
    prime:  (a, b) => (b.prime || 0) - (a.prime || 0),
    nom:    (a, b) => (a.nom || "").localeCompare(b.nom || "", "fr")
  };
  list.sort(sorters[sort]);

  if (!list.length) {
    $("#grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${traques.length
      ? "Aucun dossier ne correspond à la recherche."
      : (can("create") ? "Aucune traque enregistrée. Créez le premier dossier avec « + Nouvelle traque »." : "Aucune traque enregistrée pour le moment.")}</div>`;
    return;
  }
  $("#grid").innerHTML = list.map(t => {
    const d = DANGER[t.danger - 1] || DANGER[0];
    const closed = ["eliminee", "capturee"].includes(t.statut);
    return `
    <article class="card" data-id="${esc(t.id)}">
      <div class="danger-bar" style="background:${d.color}"></div>
      ${closed ? `<div class="stamp">${STATUS[t.statut].toUpperCase()}</div>` : ""}
      <div class="card-top">
        <div class="portrait">${portrait(t)}</div>
        <div style="min-width:0">
          <h3>${esc(t.prenom)} ${esc(t.nom)}</h3>
          <div class="race">${esc(t.race || "Race inconnue")}${t.alias ? ` · « ${esc(t.alias)} »` : ""}</div>
          <div class="motif">${esc(t.motif)}</div>
        </div>
      </div>
      <div class="card-foot">
        <span class="status st-${t.statut}">${STATUS[t.statut] || ""}</span>
        ${dangerBars(t.danger)}
        <span class="prime">${fmtPrime(t.prime)}</span>
      </div>
    </article>`;
  }).join("");
  document.querySelectorAll(".card").forEach(el => el.onclick = () => openDetail(el.dataset.id));
}

/* ---------------- Modales ---------------- */
function modal(html) {
  $("#modalRoot").innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg = $("#modalRoot .modal-bg");
  bg.addEventListener("mousedown", e => { if (e.target === bg) closeModal(); });
  bg.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
}
function closeModal() { $("#modalRoot").innerHTML = ""; currentView = null; }
const modalOpen = () => !!$("#modalRoot").children.length;
document.addEventListener("keydown", e => { if (e.key === "Escape" && modalOpen()) closeModal(); });

/* --- Création / édition d'une traque --- */
function openForm(id) {
  if (!can(id ? "edit" : "create")) return;
  const t = id ? traques.find(x => x.id === id) : { danger: 3, statut: "active", mode: "indifferent" };
  if (!t) return;
  currentView = { type: "form" };
  modal(`
    <div class="modal-head"><h2>${id ? "Modifier le dossier" : "Nouvelle traque"}</h2><button class="x" data-close>&times;</button></div>
    <form id="tForm">
      <div class="modal-body form-grid">
        <div class="section-title">Identité de la cible</div>
        <div class="field"><label class="f">Nom *</label><input type="text" name="nom" required maxlength="60" value="${esc(t.nom)}"></div>
        <div class="field"><label class="f">Prénom *</label><input type="text" name="prenom" required maxlength="60" value="${esc(t.prenom)}"></div>
        <div class="field"><label class="f">Race *</label><input type="text" name="race" required maxlength="40" value="${esc(t.race)}" list="races"></div>
        <div class="field"><label class="f">Alias / Surnom</label><input type="text" name="alias" maxlength="60" value="${esc(t.alias)}"></div>
        <div class="field"><label class="f">Affiliation</label><input type="text" name="affiliation" maxlength="80" value="${esc(t.affiliation)}" placeholder="République, Jedi, déserteur…"></div>
        <div class="field"><label class="f">Photo (URL)</label><input type="url" name="photo" value="${esc(t.photo)}" placeholder="https://…"></div>
        <div class="field full"><label class="f">Signalement physique</label><textarea name="description" maxlength="800" placeholder="Taille, signes distinctifs, équipement…">${esc(t.description)}</textarea></div>

        <div class="section-title">Mandat</div>
        <div class="field full"><label class="f">Motif *</label><textarea name="motif" required maxlength="1000" placeholder="Raisons de la traque">${esc(t.motif)}</textarea></div>
        <div class="field full">
          <label class="f">Niveau de dangerosité *</label>
          <div class="danger-pick">${DANGER.map(d => `

    const on = l.querySelector("input").checked;

  });
  document.querySelectorAll(".danger-pick input").forEach(i => i.onchange = paint); paint();

  $("#tForm").onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true;
    const f = Object.fromEntries(new FormData(e.target).entries());
    f.danger = Number(f.danger) || 3;
    f.prime = f.prime ? Number(f.prime) : 0;
    for (const k in f) if (typeof f[k] === "string") f[k] = f[k].trim();
    let target;
    if (id) {
      target = t;
      Object.assign(target, f, { updatedAt: Date.now(), updatedBy: session.pseudo });
      log(target, "Dossier modifié");
    } else {
      target = { id: uid(), ...f, createdAt: Date.now(), createdBy: session.pseudo, reports: [], history: [] };
      log(target, "Traque émise");
    }
    const ok = await putTraque(target);
    btn.disabled = false;
    if (!ok) return;
    render(); closeModal();
    if (id) toast("Dossier mis à jour");

  };
}

function log(t, action) {
  t.history = t.history || [];
  t.history.push({ at: Date.now(), by: session.pseudo, role: session.role, action });
}

  if (can("claim") && t.statut === "cours" && mine) actions += `<button class="btn ghost" id="aDrop">Abandonner</button>`;

$("#exportBtn").onclick = () => {

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);

$("#importFile").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let data, acc;
    try {
      const raw = JSON.parse(r.result);
      data = Array.isArray(raw) ? raw : raw.traques;
      acc = Array.isArray(raw) ? null : raw.acces;
      if (!Array.isArray(data) || data.some(t => !t || !t.id)) throw 0;
      if (acc && (!Array.isArray(acc) || acc.some(a => !a || !a.id))) throw 0;
    } catch (err) { toast("Fichier invalide"); e.target.value = ""; return; }
    e.target.value = "";
    if (!confirm(`Importer ${data.length} dossier(s)${acc ? ` et ${acc.length} accès` : ""} ? Les données actuelles seront remplacées.`)) return;
    if (!CLOUD) {
      traques = data; if (acc) acces = acc;
      saveLocal(); render(); toast("Import réussi"); return;
    }
    try {
      const ops = [];
      const ids = new Set(data.map(t => t.id));
      traques.filter(t => !ids.has(t.id)).forEach(t => ops.push(["del", "traques", t.id]));
      data.forEach(t => ops.push(["set", "traques", t]));
      if (acc) {
        const aids = new Set(acc.map(a => a.id));
        acces.filter(a => !aids.has(a.id)).forEach(a => ops.push(["del", "acces", a.id]));
        acc.forEach(a => ops.push(["set", "acces", a]));
      }
      for (let i = 0; i < ops.length; i += 400) {
        const batch = fb.writeBatch(fb.db);
        ops.slice(i, i + 400).forEach(([op, col, v]) => {
          if (op === "del") batch.delete(fb.doc(fb.db, col, v));
          else batch.set(fb.doc(fb.db, col, v.id), clean(v));
        });
        await batch.commit();
      }
      toast("Import réussi");
    } catch (err) { netError(err); toast("Échec de l'import"); }
  };
  r.readAsText(file);
};

/* =====================================================================
   TABLEAU D'ENQUÊTE
   Chaque traque possède un tableau : pièces photo, notes, textes,
   traits à main levée et liens entre éléments. Temps réel via Firebase.
   Les photos sont compressées puis stockées dans la collection « images ».
   ===================================================================== */
const WORLD_W = 4000, WORLD_H = 2600;
const CATS = ["Tenue","Cristal","Manche","Sabre","Arme","Armure","Vaisseau","Lieu","Complice","Document","Indice","Autre"];
const COLORS = ["#ff1f3d", "#f2ecec", "#c9a24a", "#3ad1ff", "#9b5cff", "#5fd38f"];
const TOOLS = [["select","Déplacer"],["link","Relier"],["draw","Dessiner"],["text","Texte"],["erase","Gomme"]];
const HINTS = {
  select: "Glisse un élément pour le déplacer · double-clic pour modifier · clic sur un lien pour lui donner une légende · molette pour zoomer · Ctrl+V ou glisser-déposer pour ajouter une photo",
  link:   "Clique sur un élément, puis sur un second pour les relier",
  draw:   "Dessine librement sur le tableau",
  text:   "Clique à l'endroit où tu veux écrire",
  erase:  "Clique sur un trait ou un lien pour l'effacer (les pièces se suppriment avec leur bouton ✕)"
};
const imgCache = new Map();
let B = null;

/* ----- stockage du tableau ----- */
const boardKey = tid => "registre_tableau_" + tid;
function readLocalBoard(tid) { try { return JSON.parse(localStorage.getItem(boardKey(tid))) || []; } catch (e) { return []; } }
function boardSubscribe(tid, cb) {
  if (!CLOUD) { B.localCb = cb; cb(readLocalBoard(tid)); return () => {}; }
  return fb.onSnapshot(fb.collection(fb.db, "tableaux", tid, "elements"), s => cb(s.docs.map(d => d.data())), netError);
}
function localBoardWrite(tid, fn) {
  const arr = fn(readLocalBoard(tid));
  try { localStorage.setItem(boardKey(tid), JSON.stringify(arr)); }
  catch (e) { toast("Espace de stockage du navigateur plein"); return false; }
  if (B && B.tid === tid && B.localCb) B.localCb(arr);
  return true;
}
async function boardPut(tid, el) {
  if (!CLOUD) return localBoardWrite(tid, arr => [...arr.filter(x => x.id !== el.id), clean(el)]);
  try { await fb.setDoc(fb.doc(fb.db, "tableaux", tid, "elements", el.id), clean(el)); return true; }
  catch (e) { netError(e); toast("Échec de l'enregistrement sur le tableau"); return false; }
}
async function boardDel(tid, id) {
  if (!CLOUD) return localBoardWrite(tid, arr => arr.filter(x => x.id !== id));
  try { await fb.deleteDoc(fb.doc(fb.db, "tableaux", tid, "elements", id)); return true; }
  catch (e) { netError(e); toast("Échec de la suppression"); return false; }
}
async function imgPut(data) {
  const id = uid();
  if (!CLOUD) {
    try { localStorage.setItem("registre_img_" + id, data); }
    catch (e) { toast("Espace de stockage du navigateur plein"); return null; }
  } else {
    try { await fb.setDoc(fb.doc(fb.db, "images", id), { id, data, by: session.pseudo, at: Date.now() }); }
    catch (e) { netError(e); toast("Échec de l'envoi de la photo"); return null; }
  }
  imgCache.set(id, data);
  return id;
}
async function imgGet(id) {
  if (imgCache.has(id)) return imgCache.get(id);
  let data = null;
  if (!CLOUD) data = localStorage.getItem("registre_img_" + id);
  else {
    try { const s = await fb.getDoc(fb.doc(fb.db, "images", id)); data = s.exists() ? s.data().data : null; }
    catch (e) { console.error(e); }
  }
  if (data) imgCache.set(id, data);
  return data;
}
async function imgDel(id) {
  imgCache.delete(id);
  if (!CLOUD) { try { localStorage.removeItem("registre_img_" + id); } catch (e) {} return; }
  try { await fb.deleteDoc(fb.doc(fb.db, "images", id)); } catch (e) { console.error(e); }
}
async function deleteBoard(tid) {
  let els = [];
  if (!CLOUD) {
    els = readLocalBoard(tid);
    try { localStorage.removeItem(boardKey(tid)); } catch (e) {}
  } else {
    try {
      const s = await fb.getDocs(fb.collection(fb.db, "tableaux", tid, "elements"));
      els = s.docs.map(d => d.data());
      for (let i = 0; i < els.length; i += 400) {
        const b = fb.writeBatch(fb.db);
        els.slice(i, i + 400).forEach(e => b.delete(fb.doc(fb.db, "tableaux", tid, "elements", e.id)));
        await b.commit();
      }
    } catch (e) { console.error(e); }
  }
  for (const e of els) if (e.src && e.src.kind === "img") await imgDel(e.src.id);
}

/* Compression : max ~1280 px, < 700 Ko, pour tenir dans Firestore (gratuit) */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 25 * 1024 * 1024) return reject(new Error("Image trop lourde (25 Mo max)"));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Lecture impossible"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Image illisible"));
      img.onload = () => {
        let max = 1280, q = 0.85, out = "";
        for (let i = 0; i < 10; i++) {
          const s = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
          const ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL("image/webp", q);
          if (!out.startsWith("data:image/webp")) {
            ctx.globalCompositeOperation = "destination-over";
            ctx.fillStyle = "#0a0506"; ctx.fillRect(0, 0, c.width, c.height);
            out = c.toDataURL("image/jpeg", q);
          }
          if (out.length < 700000) break;
          max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.07);
        }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ----- vue : déplacement / zoom ----- */
function applyView() {
  $("#bWorld").style.transform = `translate(${B.px}px, ${B.py}px) scale(${B.z})`;
  $("#bZoom").textContent = Math.round(B.z * 100) + "%";
}
function centerView() {
  const r = $("#bView").getBoundingClientRect();
  B.z = r.width < 700 ? 0.6 : 0.85;
  B.px = r.width / 2 - (WORLD_W / 2) * B.z;
  B.py = r.height / 2 - (WORLD_H / 2) * B.z;
  applyView();
}
function toWorld(e) {
  const r = $("#bView").getBoundingClientRect();
  return { x: (e.clientX - r.left - B.px) / B.z, y: (e.clientY - r.top - B.py) / B.z };
}
function centerWorld() {
  const r = $("#bView").getBoundingClientRect();
  return { x: (r.width / 2 - B.px) / B.z, y: (r.height / 2 - B.py) / B.z };
}
function zoomAt(mx, my, f) {
  const nz = clamp(B.z * f, 0.2, 2.5);
  B.px = mx - (mx - B.px) * (nz / B.z);
  B.py = my - (my - B.py) * (nz / B.z);
  B.z = nz; applyView();
}

/* ----- interactions ----- */
function startPan(e) {
  B.act = { kind: "pan", sx: e.clientX, sy: e.clientY, px: B.px, py: B.py };
  $("#bView").setPointerCapture(e.pointerId);
  $("#bView").classList.add("panning");

function onDown(e) {
  if (!B || e.button === 2) return;
  if (B.editing) {
    if (e.target.closest("[contenteditable=true]")) return;
    document.activeElement && document.activeElement.blur();
  }
  e.preventDefault();
  if (e.button === 1) { startPan(e); return; }
  const w = toWorld(e);
  const node = e.target.closest(".bi");
  const eid = e.target.dataset ? e.target.dataset.eid : null;

  if (eid) {
    const el = B.els.get(eid);
    if (el && B.tool === "erase") {
      if (canModify(el)) boardDel(B.tid, el.id); else toast("Tu ne peux effacer que tes propres éléments");
      return;
    }
    if (el && el.type === "link" && B.tool === "select") {
      if (!canModify(el)) { toast("Seul l'auteur du lien ou un Référent peut le modifier"); return; }
      const lab = prompt("Légende du lien (laisser vide pour aucune) :", el.label || "");
      if (lab !== null) boardPut(B.tid, { ...el, label: lab.trim().slice(0, 80) });
      return;
    }
  }

  switch (B.tool) {
    case "select": {
      if (node) {
        const el = B.els.get(node.dataset.id); if (!el) return;
        setSel(el.id);
        if (canModify(el) || el.type === "target") {
          B.act = { kind: "drag", id: el.id, sx: w.x, sy: w.y, ox: Number(el.x) || 0, oy: Number(el.y) || 0, nx: el.x, ny: el.y, moved: false, node };
          $("#bView").setPointerCapture(e.pointerId);
        }
      } else { setSel(null); startPan(e); }
      break;
    }
    case "link": {
      if (!node) { startPan(e); break; }
      const id = node.dataset.id;
      if (!B.linkFrom) { B.linkFrom = id; renderBoard(); }
      else if (B.linkFrom !== id) {
        const from = B.linkFrom;
        const exists = [...B.els.values()].some(x => x.type === "link" && ((x.from === from && x.to === id) || (x.from === id && x.to === from)));
        B.linkFrom = null;
        if (!exists) boardPut(B.tid, { id: uid(), type: "link", from, to: id, color: B.color, label: "", by: session.pseudo, at: Date.now() });
        renderBoard();
      } else { B.linkFrom = null; renderBoard(); }
      break;
    }
    case "draw":
      B.act = { kind: "draw", pts: [Math.round(w.x), Math.round(w.y)] };
      $("#bView").setPointerCapture(e.pointerId);
      break;
    case "text": {
      if (node) break;
      const id = uid();
      B.pendingEdit = id;
      setTool("select");
      boardPut(B.tid, { id, type: "text", x: Math.round(w.x), y: Math.round(w.y) - 14, text: "", color: B.color, size: 26, by: session.pseudo, at: Date.now() });

    }

}
function onMove(e) {
  if (!B) return;
  if (B.tool === "link" && B.linkFrom) {
    const a = pinPos(B.linkFrom), w = toWorld(e), p = $("#bTmpLink");
    if (a && p) p.setAttribute("d", `M${a.x} ${a.y} L${w.x} ${w.y}`);
  }
  const a = B.act; if (!a) return;
  if (a.kind === "pan") {
    B.px = a.px + (e.clientX - a.sx); B.py = a.py + (e.clientY - a.sy); applyView();
  } else if (a.kind === "drag") {
    const w = toWorld(e);
    a.nx = clamp(Math.round(a.ox + w.x - a.sx), 0, WORLD_W - 40);
    a.ny = clamp(Math.round(a.oy + w.y - a.sy), 0, WORLD_H - 40);
    if (Math.abs(a.nx - a.ox) + Math.abs(a.ny - a.oy) > 2) a.moved = true;
    a.node.style.left = a.nx + "px"; a.node.style.top = a.ny + "px";
    drawLinks();
  } else if (a.kind === "draw") {
    const w = toWorld(e), p = a.pts;
    if (p.length < 6000 && Math.hypot(w.x - p[p.length - 2], w.y - p[p.length - 1]) >= 3 / B.z) {
      p.push(Math.round(w.x), Math.round(w.y)); updateTmp();

}

}

/* Trouve un emplacement libre près du centre de la vue */
function freeSpot(w, h) {
  const c = centerWorld();
  const rects = [...document.querySelectorAll("#bItems .bi")].map(n => ({ x: n.offsetLeft, y: n.offsetTop, w: n.offsetWidth, h: n.offsetHeight }));
  const hits = (x, y) => rects.some(r => x < r.x + r.w + 20 && x + w + 20 > r.x && y < r.y + r.h + 20 && y + h + 20 > r.y);
  const x0 = c.x - w / 2, y0 = c.y - h / 2;
  for (let ring = 0; ring < 8; ring++) {
    for (let k = 0; k < 8; k++) {
      const ang = k * Math.PI / 4, d = ring * 160;
      const x = x0 + Math.cos(ang) * d, y = y0 + Math.sin(ang) * d;
      if (!hits(x, y)) return { x: Math.round(clamp(x, 0, WORLD_W - w)), y: Math.round(clamp(y, 20, WORLD_H - h)) };

    if (mode === "file" && fileData) {
      const id = await imgPut(fileData);
      if (!id) { btn.disabled = false; return; }
      if (el && el.src && el.src.kind === "img") oldImg = el.src.id;
      src = { kind: "img", id };
    } else if (mode === "url") {
      const url = $("#pUrl").value.trim();
      if (url) {
        if (!/^https?:\/\//i.test(url)) { toast("Le lien doit commencer par http:// ou https://"); btn.disabled = false; return; }
        if (el && el.src && el.src.kind === "img") oldImg = el.src.id;
        src = { kind: "url", url };
      }
    }
    if (!src) { toast("Ajoute une photo (fichier ou lien)"); btn.disabled = false; return; }
    if (!B || B.tid !== tid) { btn.disabled = false; closeModal(); return; }
    const c = editing ? null : freeSpot(220, 300);
    const obj = editing
      ? { ...el, cat, caption, src }
      : { id: uid(), type: "photo", x: c.x, y: c.y, w: 220, cat, caption, src, by: session.pseudo, at: Date.now() };
    const ok = await boardPut(tid, obj);
    btn.disabled = false;
    if (!ok) return;
    if (oldImg) imgDel(oldImg);
    closeModal();
    toast(editing ? "Pièce modifiée" : "Pièce ajoutée au tableau");
  };
}

/* ---------------- Démarrage ---------------- */
if (CLOUD) initCloud();
else { setNet("Mode local — Firebase non configuré"); restoreSession(); }
</script>
</body>
</html>
